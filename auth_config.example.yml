---
basic:
  registration:
    enabled: false
  login:
    enabled: true

sso:
  # Configure the Keycloak client before changing this to true.
  enabled: false
  enable_pkce: true
  identity_providers:
    - id: keycloak
      protocol: OIDC
      name: Keycloak
      server_url: https://keycloak.example.com/realms/cvat/.well-known/openid-configuration
      client_id: cvat
      client_secret: replace-me
      email_domain: example.com
      token_auth_method: client_secret_post
