# Development-only override. The standard compose stack keeps Traefik enabled.
services:
  traefik:
    profiles:
      - traefik

  cvat_ui:
    ports: !override
      - 127.0.0.1:8080:8000
    volumes:
      - ./cvat-ui/react_nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
